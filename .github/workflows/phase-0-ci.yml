name: Phase 0 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-0-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify preflight exists
        run: test -s runbooks/PREFLIGHT.md

      - name: Run frontend lint
        run: pnpm lint

      - name: Run frontend typecheck
        run: pnpm typecheck

      - name: Run frontend unit tests
        run: pnpm test

      - name: Run frontend dependency audit
        run: pnpm audit:frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run keyboard navigation gate
        run: pnpm test:e2e -- --grep "@keyboard"

      - name: Run accessibility gate
        run: pnpm test:e2e -- --grep "@accessibility"

      - name: Run security headers gate
        run: pnpm test:e2e -- --grep "@security"

      - name: Run API outage resilience gate
        run: pnpm test:e2e -- --grep "@api-down"

      - name: Run responsive browser/device gate
        run: pnpm test:e2e -- --grep "@responsive" --browser=all

      - name: Run frontend end-to-end tests
        run: pnpm test:e2e

      - name: Build frontend
        run: pnpm build

      - name: Run bundle budget gate
        run: pnpm bundle:budget

      - name: Run local Lighthouse check
        run: pnpm lighthouse:local

  backend:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/api/Cargo.toml --check

      - name: Run Rust clippy
        run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings

      - name: Check Shuttle API binary
        run: cargo check --manifest-path apps/api/Cargo.toml --features shuttle --bin humankaylee-api-shuttle

      - name: Run Rust tests
        run: cargo test --manifest-path apps/api/Cargo.toml

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Rust dependency audit
        run: cargo audit --file apps/api/Cargo.lock
