name: Portfolio verification artifact

on:
  push:
    branches:
      - codex/signal-proof-rewrite-20260815

permissions:
  contents: read

concurrency:
  group: portfolio-verify-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install social preview generator dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit and contract tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Upload production site
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
