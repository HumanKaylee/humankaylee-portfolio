[package]
name = "humankaylee-api"
version = "0.1.0"
edition = "2021"

[features]
default = []
shuttle = ["dep:shuttle-axum", "dep:shuttle-runtime"]

[[bin]]
name = "humankaylee-api"
path = "src/main.rs"

[[bin]]
name = "humankaylee-api-shuttle"
path = "src/bin/shuttle.rs"
required-features = ["shuttle"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuttle-axum = { version = "0.57.0", optional = true }
shuttle-runtime = { version = "0.57.0", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = "0.5"
