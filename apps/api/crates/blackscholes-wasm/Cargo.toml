[package]
name = "blackscholes-wasm"
version = "0.1.0"
edition = "2021"
description = "Black-Scholes options pricer compiled to WASM for the humankaylee portfolio demo island"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
